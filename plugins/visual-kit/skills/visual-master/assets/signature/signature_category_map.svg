ht="62.0" rx="12" fill="#111827" stroke="none" stroke-width="1.5" opacity="1.0"/><text x="100.0" y="770.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#FFFFFF" font-weight="800" text-anchor="start">Category: AI-native GTM</text><text x="828.8" y="754.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#EA580C" font-weight="700" text-anchor="start">The enemy: activity without learning</text><text x="828.8" y="780.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#6B7280" font-weight="500" text-anchor="start">Winners compound; laggards pay more for every dollar of pipeline</text></svg>