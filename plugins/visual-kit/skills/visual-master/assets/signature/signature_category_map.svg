<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs></defs><rect width="1600" height="900" fill="#FFFFFF"/><text x="80.0" y="70.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="40" fill="#111827" font-weight="700" text-anchor="start">Category-creation narrative map</text><text x="80.0" y="124.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#6B7280" font-weight="400" text-anchor="start">Name the shift, and the category names itself</text><rect x="80.0" y="180.0" width="460.0" height="530.0" rx="14" fill="#EDEEEF" stroke="none" stroke-width="1.5" opacity="1.0"/><rect x="80.0" y="180.0" width="460.0" height="58.0" rx="14" fill="#6B7280" stroke="none" stroke-width="1.5" opacity="1.0"/><rect x="80.0" y="210.0" width="460.0" height="28.0" rx="0" fill="#6B7280" stroke="none" stroke-width="1.5" opacity="1.0"/><text x="310.0" y="218.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">Old world</text><text x="104.0" y="280.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#111827" font-weight="400" text-anchor="start">• Volume-based funnels</text><text x="104.0" y="334.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#111827" font-weight="400" text-anchor="start">• Tool-by-tool automation</text><text x="104.0" y="388.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#111827" font-weight="400" text-anchor="start">• Quarterly learning</text><polygon points="546.0,427.0 564.0,445.0 546.0,463.0" fill="#111827" stroke="none" stroke-width="1.5" opacity="1.0"/><rect x="570.0" y="180.0" width="460.0" height="530.0" rx="14" fill="#FCEAE1" stroke="none" stroke-width="1.5" opacity="1.0"/><rect x="570.0" y="180.0" width="460.0" height="58.0" rx="14" fill="#EA580C" stroke="none" stroke-width="1.5" opacity="1.0"/><rect x="570.0" y="210.0" width="460.0" height="28.0" 