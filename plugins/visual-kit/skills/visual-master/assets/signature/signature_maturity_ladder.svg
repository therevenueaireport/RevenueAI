ata</text><text x="384.0" y="610.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#6B7280" font-weight="400" text-anchor="start">Copy-paste</text><text x="672.0" y="610.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#6B7280" font-weight="400" text-anchor="start">Connected tools</text><text x="960.0" y="610.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#6B7280" font-weight="400" text-anchor="start">Unified signals</text><text x="1248.0" y="610.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#111827" font-weight="600" text-anchor="start">Proprietary data moat</text><rect x="80.0" y="676.0" width="1440.0" height="116.0" rx="8" fill="#F4F5F7" stroke="none" stroke-width="1.5" opacity="1.0"/><text x="96.0" y="740.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#111827" font-weight="700" text-anchor="start">Governance</text><text x="384.0" y="734.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#6B7280" font-weight="400" text-anchor="start">None</text><text x="672.0" y="734.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#6B7280" font-weight="400" text-anchor="start">Usage policy</text><text x="960.0" y="734.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#6B7280" font-weight="400" text-anchor="start">Decision rights + evals</text><text x="1248.0" y="734.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#111827" font-weight="600" text-anchor="start">Continuous audit</text><rect x="710.0" y="816.0" width="180.0" height="34.0" rx="17" fill="#EA580C" stroke="none" stroke-width="1.5" opacity="1.0"/><text x="800.0" y="839.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Most teams today</text></svg>